<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EA">
<meta name="description" content="카사페 직원 출퇴근 도장 보드">
<title>출퇴근 도장 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Black+Han+Sans&family=Gothic+A1:wght@300;400;500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        paper:  "#F3F1EA",
        paper2: "#EBE7DC",
        card:   "#FFFDF8",
        ink:    "#241C15",
        ink2:   "#5C5046",
        muted:  "#94897C",
        line:   "#E2DCCF",
        line2:  "#EFEBE0",
        cobalt: "#23479B",
        cobalt2:"#4A72CE",
        cobaltSoft:"#E4EAF7",
        rest:   "#3F6B52",
        rest2:  "#6D9C82",
        restSoft:"#E2EDE6",
        gold:   "#B57C08",
        gold2:  "#E8A317",
        goldSoft:"#FAEDD2"
      },
      fontFamily: {
        han:  ['"Black Han Sans"','"Apple SD Gothic Neo"','sans-serif'],
        sans: ['"Gothic A1"','"Apple SD Gothic Neo"','"Malgun Gothic"','system-ui','sans-serif'],
        num:  ['Archivo','"Gothic A1"','system-ui','sans-serif']
      }
    }
  }
}
</script>
<style>
  html { scroll-behavior: smooth; }
  body { background:#F3F1EA; color:#241C15; margin:0; font-family:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif; }
  .num { font-family:Archivo,"Gothic A1",system-ui,sans-serif; font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .han { font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif; }
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.22'/></svg>");
  }
  .glow{
    position:fixed; z-index:0; width:620px; height:620px; margin:-310px 0 0 -310px;
    border-radius:50%; pointer-events:none; will-change:transform;
    background:radial-gradient(circle, rgba(232,163,23,.22) 0%, rgba(232,163,23,.10) 38%, rgba(232,163,23,0) 68%);
    filter:blur(18px); opacity:0; transition:opacity .5s ease;
  }
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1); }
  .reveal.in{ opacity:1; transform:none; }
  .stamp-pop{ animation:stampIn .42s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes stampIn{ 0%{transform:rotate(-26deg) scale(1.5); opacity:0} 55%{opacity:1} 100%{transform:rotate(-9deg) scale(1); opacity:1} }
  .pulse-dot{ animation:pd 2.2s ease-in-out infinite; }
  @keyframes pd{ 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.78)} }
  .marq{ animation:mq 34s linear infinite; }
  @keyframes mq{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .modal-in{ animation:mi .2s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes mi{ from{opacity:0; transform:translateY(14px) scale(.98)} to{opacity:1; transform:none} }
  textarea{ font-family:inherit; }
  ::selection{ background:#23479B; color:#FFFDF8; }
  *:focus-visible{ outline:2px solid #23479B; outline-offset:3px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .reveal{opacity:1 !important; transform:none !important; transition:none}
    .stamp-pop,.pulse-dot,.marq,.modal-in{animation:none !important}
    *{transition-duration:.01ms !important}
  }
</style>

</head>
<body>
<div class="grain"></div>
<div id="glow" class="glow"></div>
<div id="root" class="relative" style="z-index:2"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ─────────── 설정 ─────────── */
const STAFF = ["유정미 매니저","강민경","김가람","김민정","박시은","윤이나","이다운","장세빈","정예은","정유나"];
const KEY = "casape-attendance-v1";
const ADMIN_PW = "admin";   /* 근무 요약 열람용 — 소스에 그대로 있으므로 화면 가림 용도입니다 */
const DAYS = ["일","월","화","수","목","금","토"];

/* ─────────── 유틸 ─────────── */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey = () => ymd(new Date());
const parseKey = k => { const p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); };
const prettyDate = k => { const d=parseKey(k); return `${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`; };
const yearOf = k => parseKey(k).getFullYear();
const hhmm = ts => { const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const durPlain = ms => { ms=Math.max(0,ms); const m=Math.floor(ms/60000); return `${Math.floor(m/60)}시간 ${m%60}분`; };
const durTight = ms => { ms=Math.max(0,ms); const m=Math.floor(ms/60000); return m<60 ? `${m}분` : `${Math.floor(m/60)}시간 ${m%60}분`; };

function loadDB(){
  try{ const r=localStorage.getItem(KEY); const o=r?JSON.parse(r):{}; return (o&&typeof o==="object")?o:{}; }
  catch(e){ return {}; }
}
const blank = () => ({ in:null, out:null, memo:"", breaks:[] });
const getRec = (db,k,n) => (db[k] && db[k][n]) || blank();
const openBreak = r => (r.breaks || []).find(b => b.start && !b.end) || null;
const breakMs = (r, ref) => (r.breaks || []).reduce((a,b) => {
  if(!b.start) return a;
  const end = b.end != null ? b.end : (ref != null ? ref : Date.now());
  return a + Math.max(0, end - b.start);
}, 0);
/* 실근무 = 체류 − 휴게 */
const netMs = (r, ref) => {
  if(!r.in) return 0;
  const end = r.out != null ? r.out : (ref != null ? ref : Date.now());
  return Math.max(0, (end - r.in) - breakMs(r, end));
};
const grossMs = (r, ref) => {
  if(!r.in) return 0;
  const end = r.out != null ? r.out : (ref != null ? ref : Date.now());
  return Math.max(0, end - r.in);
};
const stateOf = r => !r.in ? "idle" : (!r.out ? (openBreak(r) ? "rest" : "work") : "done");

/* ─────────── 설정(휴게 공제·백업) ─────────── */
const SKEY = "casape-settings-v1";
const DEFAULTS = { lastExport: null };
function loadSettings(){
  try{ const r = localStorage.getItem(SKEY); const o = r ? JSON.parse(r) : {};
       return Object.assign({}, DEFAULTS, (o && typeof o === "object") ? o : {}); }
  catch(e){ return Object.assign({}, DEFAULTS); }
}

/* ─────────── 월 유틸 ─────────── */
const monthKey   = () => todayKey().slice(0,7);
const prettyMonth = m => { const p = m.split("-"); return p[0] + "년 " + (+p[1]) + "월"; };
const shiftMonth  = (m,n) => { const p = m.split("-"); const d = new Date(+p[0], +p[1]-1+n, 1);
                               return d.getFullYear() + "-" + pad(d.getMonth()+1); };

function monthStats(db, m, s){
  const per = {};
  STAFF.forEach(n => per[n] = { days:0, gross:0, brk:0, missing:[] });
  Object.keys(db).filter(k => k.slice(0,7) === m).sort().forEach(k => {
    STAFF.forEach(n => {
      const r = (db[k] || {})[n];
      if(!r) return;
      if(r.in && r.out){
        per[n].days++;
        per[n].gross += grossMs(r);
        per[n].brk   += breakMs(r, r.out);
      } else if(r.in && !r.out){
        per[n].missing.push(k);
      }
    });
  });
  return per;
}

/* 태블릿 재시작 대비 — 어제 미퇴근자가 남아 있으면 그 날짜를 다시 열어 준다 */
function openDayKey(db){
  const tk = todayKey();
  const yk = ymd(new Date(Date.now() - 86400000));
  const day = db[yk] || {};
  const stillOpen = STAFF.some(n => day[n] && day[n].in && !day[n].out);
  return stillOpen ? yk : tk;
}

const TONE = {
  idle: { label:"미출근",   ink:"text-muted",      ring:"border-line",       chip:"bg-paper2 text-muted",        bar:"bg-line" },
  work: { label:"근무중",   ink:"text-gold",       ring:"border-gold2/70",   chip:"bg-goldSoft text-gold",       bar:"bg-gold2" },
  rest: { label:"휴게중",   ink:"text-rest",       ring:"border-rest2/70",   chip:"bg-restSoft text-rest",       bar:"bg-rest2" },
  done: { label:"퇴근완료", ink:"text-cobalt",     ring:"border-cobalt2/60", chip:"bg-cobaltSoft text-cobalt",   bar:"bg-cobalt" }
};

/* ─────────── 커서 광원 ─────────── */
function useGlow(){
  useEffect(() => {
    const el = document.getElementById("glow");
    if(!el) return;
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if(!window.matchMedia("(pointer: fine)").matches) return;
    let tx=innerWidth/2, ty=innerHeight*0.3, x=tx, y=ty, raf;
    const move = e => { tx=e.clientX; ty=e.clientY; el.style.opacity=1; };
    const loop = () => { x+=(tx-x)*0.075; y+=(ty-y)*0.075;
      el.style.transform=`translate3d(${x}px,${y}px,0)`; raf=requestAnimationFrame(loop); };
    window.addEventListener("pointermove", move, {passive:true});
    loop();
    return () => { window.removeEventListener("pointermove", move); cancelAnimationFrame(raf); };
  }, []);
}

/* ─────────── 스크롤 리빌 ─────────── */
function useReveal(){
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }}), {threshold:.12});
    els.forEach(e => io.observe(e));
    return () => io.disconnect();
  }, []);
}

/* ─────────── 도장 ─────────── */
function Stamp({ st, justChanged }){
  if(st === "idle"){
    return (
      <div className="w-[68px] h-[68px] rounded-full border-2 border-dashed border-line flex items-center justify-center shrink-0
                      transition-all duration-300 group-hover:border-gold2/60 group-hover:rotate-6">
        <span className="text-[11px] text-muted tracking-[.14em] transition-colors group-hover:text-gold">출근</span>
      </div>
    );
  }
  const done = st === "done";
  const rest = st === "rest";
  const c = done ? "text-cobalt border-cobalt" : (rest ? "text-rest border-rest" : "text-gold border-gold");
  return (
    <div className={`relative w-[68px] h-[68px] shrink-0 ${justChanged ? "stamp-pop" : ""}`} style={{transform:"rotate(-9deg)"}}>
      <div className={`absolute inset-0 rounded-full border-[2.5px] ${c} opacity-90`}></div>
      <div className={`absolute inset-[5px] rounded-full border ${c} opacity-45`}></div>
      <div className="absolute inset-0 flex flex-col items-center justify-center leading-none">
        <span className={`han text-[15px] ${c.split(" ")[0]}`}>{done ? "퇴근" : (rest ? "휴게" : "근무")}</span>
        <span className={`num text-[10px] mt-[3px] font-semibold tracking-wider ${c.split(" ")[0]} opacity-75`}>
          {done ? "OUT" : (rest ? "REST" : "IN")}
        </span>
      </div>
    </div>
  );
}

/* ─────────── 카드 ─────────── */
function Card({ name, rec, locked, now, onPunch, onMemo, onUndo, onFix, onBreak, flash }){
  const canFix = locked && rec.in && (!rec.out || rec.fixed);
  const st = stateOf(rec);
  const t = TONE[st];
  const ob = openBreak(rec);
  const brk = rec.in ? breakMs(rec, rec.out != null ? rec.out : now) : 0;
  const net = rec.in ? netMs(rec, now) : 0;
  const restRun = ob ? now - ob.start : 0;

  return (
    <article className={`group relative rounded-[20px] bg-card border overflow-hidden
      transition-all duration-300 ease-out
      ${st==="work" ? "border-gold2/45 shadow-[0_2px_0_0_rgba(232,163,23,.18),0_18px_38px_-26px_rgba(36,28,21,.5)]"
        : st==="done" ? "border-cobalt2/35 shadow-[0_1px_0_0_rgba(35,71,155,.12),0_16px_34px_-28px_rgba(36,28,21,.45)]"
        : "border-line shadow-[0_14px_30px_-28px_rgba(36,28,21,.45)]"}
      ${locked ? "" : "hover:-translate-y-[3px] hover:shadow-[0_26px_46px_-26px_rgba(36,28,21,.42)]"}`}>

      <div className={`absolute left-0 top-0 h-[3px] w-full ${t.bar} transition-all duration-500
                       ${st==="idle" ? "opacity-30" : "opacity-100"}`}></div>

      <button type="button" onClick={onPunch}
        className={`block w-full text-left px-6 pt-6 pb-5 ${locked ? "cursor-default" : "cursor-pointer"}`}>
        <div className="flex items-start gap-4">
          <div className="min-w-0 flex-1">
            <h3 className="text-[27px] font-extrabold tracking-[-.035em] leading-none text-ink">{name}</h3>
            <div className={`mt-3 inline-flex items-center gap-[7px] rounded-full px-[10px] py-[4px] text-[11.5px] font-medium ${t.chip}`}>
              {st === "work" && <span className="w-[6px] h-[6px] rounded-full bg-gold2 pulse-dot"></span>}
              {t.label}
            </div>
          </div>
          <Stamp st={st} justChanged={flash} />
        </div>

        <div className="mt-6 flex gap-8">
          <div>
            <div className="num text-[9.5px] font-semibold tracking-[.19em] text-muted">IN</div>
            <div className={`num text-[22px] font-semibold mt-[3px] leading-none ${rec.in ? "text-ink" : "text-line"}`}>
              {rec.in ? hhmm(rec.in) : "--:--"}
            </div>
          </div>
          <div>
            <div className="num text-[9.5px] font-semibold tracking-[.19em] text-muted">OUT</div>
            <div className={`num text-[22px] font-semibold mt-[3px] leading-none ${rec.out ? "text-ink" : "text-line"}`}>
              {rec.out ? hhmm(rec.out) : "--:--"}
              {rec.fixed && <span className="ml-1.5 align-middle rounded-full bg-cobaltSoft px-[7px] py-[2px] text-[10px] font-bold text-cobalt tracking-normal">보정</span>}
            </div>
          </div>
          <div>
            <div className="num text-[9.5px] font-semibold tracking-[.19em] text-muted">휴게</div>
            <div className={`num text-[22px] font-semibold mt-[3px] leading-none ${brk ? "text-rest" : "text-line"}`}>
              {brk ? durTight(brk) : "--"}
            </div>
          </div>
        </div>

        <div className="mt-5 pt-4 border-t border-dashed border-line2 flex items-baseline">
          <span className="num text-[9.5px] font-semibold tracking-[.19em] text-muted">실근무</span>
          <span className={`ml-auto text-[17px] font-bold tracking-tight ${st==="idle" ? "text-line" : t.ink}`}>
            {st === "idle" ? "—" : durPlain(net)}
            {(st === "work" || st === "rest") && <span className="ml-[6px] text-[11px] font-medium text-muted">진행중</span>}
          </span>
        </div>
      </button>

      {!locked && (st === "work" || st === "rest") && (
        <div className="border-t border-line2 px-4 py-3 bg-paper/40">
          <button type="button" onClick={onBreak}
            className={`w-full rounded-xl py-3 text-[14px] font-bold tracking-tight transition-colors
              ${st === "rest"
                ? "bg-rest text-card hover:bg-rest2"
                : "border border-rest2/55 bg-restSoft/70 text-rest hover:bg-restSoft"}`}>
            {st === "rest"
              ? <>휴게 종료 <span className="num font-semibold opacity-90">({durTight(restRun)} 경과)</span></>
              : "휴게 시작"}
          </button>
        </div>
      )}

      <div className="flex items-stretch border-t border-line2 bg-paper/55">
        <textarea rows="2" value={rec.memo || ""} readOnly={locked}
          onChange={e => onMemo(e.target.value)}
          placeholder={locked ? "" : "메모 — 지각 사유, 조퇴 등"}
          className="flex-1 min-w-0 resize-none bg-transparent px-6 py-3 text-[12.5px] leading-relaxed text-ink2
                     placeholder:text-muted/75 focus:outline-none focus:bg-card/90 transition-colors" />
        {!locked && st !== "idle" && (
          <button type="button" onClick={onUndo} title={`${name} 기록 되돌리기`} aria-label={`${name} 기록 되돌리기`}
            className="w-[46px] shrink-0 border-l border-line2 text-muted text-[15px]
                       hover:text-gold hover:bg-goldSoft/60 transition-colors">↺</button>
        )}
        {canFix && (
          <button type="button" onClick={onFix}
            className={`shrink-0 border-l border-line2 px-4 text-[12px] font-semibold whitespace-nowrap transition-colors
              ${rec.out ? "text-cobalt hover:bg-cobaltSoft/60" : "text-gold bg-goldSoft/50 hover:bg-goldSoft"}`}>
            {rec.out ? "보정 수정" : "퇴근 시각 입력"}
          </button>
        )}
      </div>
    </article>
  );
}

/* ─────────── 모달 ─────────── */
function Modal({ data, onClose }){
  const ref = useRef(null);
  useEffect(() => {
    const k = e => { if(e.key === "Escape") onClose(); };
    document.addEventListener("keydown", k);
    const b = ref.current && ref.current.querySelector("[data-focus]");
    if(b) b.focus();
    return () => document.removeEventListener("keydown", k);
  }, [onClose]);
  if(!data) return null;

  return (
    <div onMouseDown={e => { if(e.target === e.currentTarget) onClose(); }}
      className="fixed inset-0 z-50 flex items-center justify-center p-5"
      style={{background:"rgba(36,28,21,.42)", backdropFilter:"blur(4px)"}}>
      <div ref={ref} role="dialog" aria-modal="true"
        className={`modal-in w-full ${data.wide ? "max-w-[640px]" : "max-w-[420px]"} rounded-[22px] bg-card border border-line p-7
                    shadow-[0_40px_80px_-30px_rgba(36,28,21,.6)]`}>
        <h3 className="han text-[22px] text-ink leading-tight">{data.title}</h3>
        <div className="mt-3 text-[13.5px] leading-relaxed text-ink2">{data.body}</div>
        <div className="mt-7 flex justify-end gap-2.5">
          <button onClick={onClose}
            className="rounded-xl border border-line px-4 py-2.5 text-[13.5px] font-medium text-ink2 hover:border-muted transition-colors">
            {data.cancelText || "취소"}
          </button>
          {data.okText && (
            <button data-focus onClick={() => { onClose(); data.onOk && data.onOk(); }}
              className="rounded-xl bg-cobalt px-5 py-2.5 text-[13.5px] font-semibold text-card hover:bg-cobalt2 transition-colors">
              {data.okText}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─────────── 월간 정산 ─────────── */
function MonthView({ db, month, setMonth, settings, saveSettings, onGoDate, onCSV }){
  const per = monthStats(db, month, settings);
  const rows = STAFF.map(n => {
    const x = per[n];
    const net = Math.max(0, x.gross - x.brk);
    return { name:n, days:x.days, gross:x.gross, brk:x.brk, net, missing:x.missing };
  });
  const sum = f => rows.reduce((a,r) => a + f(r), 0);
  const tDays = sum(r => r.days), tGross = sum(r => r.gross), tBrk = sum(r => r.brk), tNet = sum(r => r.net);
  const tMiss = sum(r => r.missing.length);
  const atNow = month >= monthKey();
  const empty = tDays === 0 && tMiss === 0;

  return (
    <section className="mt-8">
      {/* 월 이동 */}
      <div className="flex flex-wrap items-center gap-2.5">
        <button onClick={() => setMonth(shiftMonth(month,-1))}
          className="rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 hover:border-cobalt hover:text-cobalt transition-colors">◀ 이전달</button>
        <div className="num rounded-full border border-line bg-card px-4 py-2 text-[13px] font-semibold text-ink">{prettyMonth(month)}</div>
        <button onClick={() => { if(!atNow) setMonth(shiftMonth(month,1)); }} disabled={atNow}
          className="rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 enabled:hover:border-cobalt enabled:hover:text-cobalt disabled:opacity-35 transition-colors">다음달 ▶</button>
        <button onClick={() => setMonth(monthKey())}
          className="rounded-full bg-ink px-4 py-2 text-[12.5px] font-semibold text-paper hover:bg-cobalt transition-colors">이번 달</button>
        <button onClick={onCSV}
          className="ml-auto rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 hover:border-cobalt hover:text-cobalt transition-colors">이 달 CSV</button>
      </div>

      {/* 휴게 안내 */}
      <div className="mt-4 flex flex-wrap items-center gap-3 rounded-2xl border border-rest2/40 bg-restSoft/50 px-5 py-4">
        <span className="num text-[9.5px] font-bold tracking-[.2em] text-rest">BREAK</span>
        <span className="text-[13px] text-ink2">
          휴게는 <b className="text-rest">실제로 버튼을 눌러 기록된 시간만</b> 공제합니다. 자동 공제는 하지 않습니다.
        </span>
      </div>

      {/* 표 */}
      <div className="mt-5 rounded-[20px] border border-line bg-card overflow-x-auto shadow-[0_16px_36px_-30px_rgba(36,28,21,.5)]">
        <table className="w-full min-w-[720px] text-[13.5px]">
          <thead>
            <tr className="bg-paper/70">
              {["이름","출근일수","총 체류","휴게","실근무","확인필요"].map(h => (
                <th key={h} className="num text-left text-[9.5px] font-bold tracking-[.2em] text-muted px-5 py-3.5 border-b border-line whitespace-nowrap">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.name} className="border-b border-line2 last:border-0 hover:bg-paper/50 transition-colors">
                <td className="px-5 py-3.5 whitespace-nowrap font-semibold text-ink">{r.name}</td>
                <td className="num px-5 py-3.5 whitespace-nowrap text-ink2">{r.days ? r.days + "일" : "—"}</td>
                <td className="px-5 py-3.5 whitespace-nowrap text-ink2">{r.days ? durPlain(r.gross) : "—"}</td>
                <td className="px-5 py-3.5 whitespace-nowrap text-muted">{r.brk ? "-" + durTight(r.brk) : "—"}</td>
                <td className={`px-5 py-3.5 whitespace-nowrap font-bold ${r.days ? "text-cobalt" : "text-line"}`}>{r.days ? durPlain(r.net) : "—"}</td>
                <td className="px-5 py-3.5 whitespace-nowrap">
                  {r.missing.length ? (
                    <button onClick={() => onGoDate(r.missing[0])}
                      className="rounded-full border border-gold2/55 bg-goldSoft/70 px-3 py-1.5 text-[12px] font-semibold text-gold hover:border-gold transition-colors">
                      퇴근 누락 <span className="num">{r.missing.length}</span>일 ▸
                    </button>
                  ) : <span className="text-muted">—</span>}
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr className="bg-paper/70 border-t border-line">
              <td className="px-5 py-4 font-bold text-ink">합계</td>
              <td className="num px-5 py-4 font-semibold text-ink2 whitespace-nowrap">{tDays ? tDays + "일" : "—"}</td>
              <td className="px-5 py-4 font-semibold text-ink2 whitespace-nowrap">{tGross ? durPlain(tGross) : "—"}</td>
              <td className="px-5 py-4 font-semibold text-muted whitespace-nowrap">{tBrk ? "-" + durTight(tBrk) : "—"}</td>
              <td className="px-5 py-4 font-bold text-cobalt whitespace-nowrap">{tNet ? durPlain(tNet) : "—"}</td>
              <td className="px-5 py-4 text-[12px] whitespace-nowrap">
                {tMiss ? <span className="font-semibold text-gold"><span className="num">{tMiss}</span>건</span> : <span className="text-muted">없음</span>}
              </td>
            </tr>
          </tfoot>
        </table>
      </div>

      {empty && (
        <p className="mt-6 text-[13px] text-muted">{prettyMonth(month)}에 기록된 근무가 없습니다.</p>
      )}

      <p className="mt-6 text-[11.5px] leading-relaxed text-muted">
        <b className="text-ink2">실근무 = 총 체류 − 휴게</b>. 휴게는 카드의 휴게 버튼으로 <b className="text-rest">실제 기록된 시간만</b> 빠지며, 버튼을 누르지 않은 날은 휴게 0분으로 계산됩니다.<br />
        퇴근 도장이 찍히지 않은 날은 시간을 계산할 수 없어 합계에서 빠지고 <b className="text-gold">확인필요</b>에 표시됩니다 — 눌러서 그 날짜로 이동해 채워 주세요.<br />
        시간은 실제로 도장을 찍은 시각 그대로 1분 단위로 합산합니다.
      </p>
    </section>
  );
}

/* ─────────── 앱 ─────────── */
function App(){
  const [db, setDb] = useState(loadDB);
  const [viewKey, setViewKey] = useState(() => openDayKey(loadDB()));
  const [activeKey, setActiveKey] = useState(() => openDayKey(loadDB()));
  const [tab, setTab] = useState("board");
  const [month, setMonth] = useState(monthKey);
  const [settings, setSettings] = useState(loadSettings);
  const [now, setNow] = useState(Date.now());
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState("");
  const [admin, setAdmin] = useState(false);
  const [pw, setPw] = useState("");
  const [flash, setFlash] = useState(null);
  const toastT = useRef(null);

  useGlow();
  useReveal();

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  /* 자정이 지나도 아직 근무 중인 사람이 있으면 그 날짜를 계속 열어 둔다 */
  useEffect(() => {
    const tk = todayKey();
    if(activeKey === tk) return;
    const stillOpen = STAFF.some(n => { const r = getRec(db, activeKey, n); return r.in && !r.out; });
    if(!stillOpen){
      setViewKey(v => (v === activeKey ? tk : v));
      setActiveKey(tk);
    }
  }, [now, db, activeKey]);

  const persist = useCallback(next => {
    setDb(next);
    try{ localStorage.setItem(KEY, JSON.stringify(next)); }
    catch(e){ say("저장 공간에 쓸 수 없어 이번 기록이 남지 않았습니다"); }
  }, []);

  const saveSettings = patch => {
    const next = Object.assign({}, settings, patch);
    setSettings(next);
    try{ localStorage.setItem(SKEY, JSON.stringify(next)); }catch(e){}
  };

  function unlock(){
    if(pw === ADMIN_PW){ setAdmin(true); setPw(""); say("관리자 확인 — 근무 요약을 엽니다"); }
    else { setPw(""); say("비밀번호가 올바르지 않습니다"); }
  }

  function say(msg){
    setToast(msg);
    clearTimeout(toastT.current);
    toastT.current = setTimeout(() => setToast(""), 2600);
  }

  const locked = viewKey !== todayKey() && viewKey !== activeKey;
  const carryOver = activeKey !== todayKey();
  const carryCount = STAFF.filter(n => { const r = getRec(db, activeKey, n); return r.in && !r.out; }).length;
  const write = (name, patch) => {
    const day = { ...(db[viewKey] || {}) };
    day[name] = { ...getRec(db, viewKey, name), ...patch };
    persist({ ...db, [viewKey]: day });
  };

  function punch(name){
    if(locked){ say("지난 날짜는 조회만 가능합니다"); return; }
    const r = getRec(db, viewKey, name);
    const st = stateOf(r);

    if(st === "idle"){
      const t = Date.now();
      write(name, { in:t });
      setFlash(name); setTimeout(() => setFlash(null), 500);
      say(`${name} 출근 ${hhmm(t)}`);
      return;
    }
    if(st === "work" || st === "rest"){
      const t = Date.now();
      const ob = openBreak(r);
      const brkNow = breakMs(r, t);
      setModal({
        title: `${name} 퇴근`,
        body: (
          <div>
            <p><b className="num font-semibold text-ink">{hhmm(r.in)}</b> 출근 → 지금 <b className="num font-semibold text-ink">{hhmm(t)}</b> 로 퇴근 도장을 찍습니다.</p>
            {ob && <p className="mt-2 text-rest">휴게가 진행 중입니다 — <b>지금 자동으로 종료</b>됩니다.</p>}
            <p className="mt-4 text-muted text-[11px] num font-semibold tracking-[.18em]">체류 / 휴게 / 실근무</p>
            <p className="text-[15px] text-ink2 mt-1">
              <span className="num font-semibold">{durPlain(t - r.in)}</span>
              <span className="mx-2 text-muted">−</span>
              <span className="num font-semibold text-rest">{brkNow ? durTight(brkNow) : "0분"}</span>
            </p>
            <p className="han text-[34px] text-cobalt leading-none mt-2">{durPlain(Math.max(0,(t - r.in) - brkNow))}</p>
          </div>
        ),
        okText: "퇴근 도장",
        onOk: () => {
          const o = Date.now();
          const bs = (r.breaks || []).map(b => (b.start && !b.end) ? { ...b, end:o } : b);
          write(name, { out:o, breaks:bs });
          setFlash(name); setTimeout(() => setFlash(null), 500);
          const nb = bs.reduce((a,b) => a + Math.max(0,(b.end||o) - b.start), 0);
          say(`${name} 퇴근 ${hhmm(o)} · 실근무 ${durPlain(Math.max(0,(o - r.in) - nb))}`);
        }
      });
      return;
    }
    say(`${name} 오늘 실근무 ${durPlain(netMs(r))} · 마감`);
  }

  /* 휴게 — 1회 시작 / 1회 종료 */
  function punchBreak(name){
    if(locked){ say("지난 날짜는 조회만 가능합니다"); return; }
    const r = getRec(db, viewKey, name);
    if(!r.in || r.out){ say("근무 중일 때만 휴게를 찍을 수 있습니다"); return; }
    const list = (r.breaks || []).slice();
    const idx = list.findIndex(b => b.start && !b.end);
    const t = Date.now();
    if(idx === -1){
      list.push({ start:t, end:null });
      write(name, { breaks:list });
      setFlash(name); setTimeout(() => setFlash(null), 500);
      say(`${name} 휴게 시작 ${hhmm(t)}`);
    } else {
      list[idx] = { ...list[idx], end:t };
      write(name, { breaks:list });
      setFlash(name); setTimeout(() => setFlash(null), 500);
      const total = list.reduce((a,b) => a + Math.max(0,(b.end||t) - b.start), 0);
      say(`${name} 휴게 종료 ${hhmm(t)} · 이번 ${durTight(t - list[idx].start)} / 오늘 ${durTight(total)}`);
    }
  }

  function undo(name){
    setModal({
      title: `${name} 기록 되돌리기`,
      body: <p>이 날짜의 <b className="text-ink font-semibold">출근·퇴근 시각과 휴게 기록</b>을 지웁니다. 메모는 그대로 남습니다.</p>,
      okText: "되돌리기",
      onOk: () => { write(name, { in:null, out:null, breaks:[], fixed:false }); say(`${name} 기록을 되돌렸습니다`); }
    });
  }

  function fixOut(name){
    const r = getRec(db, viewKey, name);
    if(!r.in) return;
    const def = r.out ? hhmm(r.out) : "18:00";
    setModal({
      title: `${name} 퇴근 시각 보정`,
      body: (
        <div>
          <p><b className="num font-semibold text-ink">{prettyDate(viewKey)}</b> · <b className="num font-semibold text-ink">{hhmm(r.in)}</b> 출근 기록만 있고 퇴근 도장이 없습니다.<br />실제 퇴근 시각을 입력해 주세요.</p>
          <input id="fixtime" type="time" defaultValue={def}
            className="num mt-4 w-full rounded-xl border border-line bg-paper/60 px-4 py-3 text-[20px] font-semibold text-ink text-center" />
          <p className="mt-3 text-[11.5px] leading-relaxed text-muted">
            출근 시각보다 이른 시각을 넣으면 <b className="text-ink2">다음날</b> 퇴근으로 처리됩니다.<br />
            보정한 기록에는 <b className="text-cobalt">보정</b> 표시가 남습니다.
          </p>
        </div>
      ),
      okText: "보정 저장",
      onOk: () => {
        const el = document.getElementById("fixtime");
        const v = el && el.value;
        if(!v){ say("시각을 입력해 주세요"); return; }
        const hh = +v.split(":")[0], mm = +v.split(":")[1];
        const base = parseKey(viewKey);
        let t = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hh, mm).getTime();
        if(t <= r.in) t += 86400000;
        const bs2 = (r.breaks || []).map(b => (b.start && !b.end) ? { ...b, end: Math.min(t, b.start) === t ? b.start : t } : b);
        write(name, { out:t, fixed:true, breaks:bs2 });
        say(`${name} 퇴근 ${hhmm(t)} 보정 · ${durPlain(t - r.in)}`);
      }
    });
  }

  function shift(n){
    const d = parseKey(viewKey); d.setDate(d.getDate() + n);
    if(ymd(d) > todayKey()) return;
    setViewKey(ymd(d));
  }

  /* CSV */
  const csvCell = v => { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  function buildCSV(keys){
    const rows = [["날짜","이름","출근","퇴근","체류(분)","휴게(분)","실근무(분)","실근무","메모","보정"]];
    keys.slice().sort().forEach(k => STAFF.forEach(n => {
      const r = (db[k] || {})[n];
      if(!r || (!r.in && !r.out && !r.memo)) return;
      const done = r.in && r.out;
      const g  = done ? Math.floor(grossMs(r)/60000) : "";
      const bm = done ? Math.floor(breakMs(r, r.out)/60000) : "";
      const nt = done ? Math.floor(netMs(r)/60000) : "";
      rows.push([k, n, r.in?hhmm(r.in):"", r.out?hhmm(r.out):"", g, bm, nt,
                 done ? durPlain(netMs(r)) : (r.in ? "퇴근누락" : ""), r.memo||"", r.fixed?"보정":""]);
    }));
    return rows.map(r => r.map(csvCell).join(",")).join("\n");
  }
  function openCSV(title, keys){
    const text = buildCSV(keys);
    if(text.indexOf("\n") === -1){ say("내보낼 기록이 없습니다"); return; }
    openCSVText(title, text);
  }

  function buildMonthCSV(m){
    const per = monthStats(db, m, settings);
    const rows = [];
    rows.push(["월간 정산", prettyMonth(m)]);
    rows.push(["휴게 공제", "실제 기록된 휴게시간만 공제 (자동 공제 없음)"]);
    rows.push([]);
    rows.push(["이름","출근일수","총 체류(분)","휴게(분)","실근무(분)","실근무","퇴근누락(일)"]);
    let any = false;
    STAFF.forEach(n => {
      const x = per[n];
      if(!x.days && !x.missing.length) return;
      any = true;
      const net = Math.max(0, x.gross - x.brk);
      rows.push([n, x.days, Math.floor(x.gross/60000), Math.floor(x.brk/60000),
                 Math.floor(net/60000), durPlain(net), x.missing.length]);
    });
    if(!any) return null;
    rows.push([]);
    rows.push(["일별 상세"]);
    rows.push(["날짜","이름","출근","퇴근","체류(분)","휴게(분)","실근무(분)","메모","보정"]);
    Object.keys(db).filter(k => k.slice(0,7) === m).sort().forEach(k => STAFF.forEach(n => {
      const r = (db[k] || {})[n];
      if(!r || (!r.in && !r.out && !r.memo)) return;
      if(r.in && r.out){
        rows.push([k, n, hhmm(r.in), hhmm(r.out),
                   Math.floor(grossMs(r)/60000), Math.floor(breakMs(r, r.out)/60000),
                   Math.floor(netMs(r)/60000), r.memo || "", r.fixed ? "보정" : ""]);
      } else {
        rows.push([k, n, r.in ? hhmm(r.in) : "", r.out ? hhmm(r.out) : "",
                   "퇴근누락", "", "", r.memo || "", ""]);
      }
    }));
    return rows.map(r => r.map(csvCell).join(",")).join("\n");
  }

  function openCSVText(title, text){
    setModal({
      title, wide:true, cancelText:"닫기", okText:"복사하기",
      body: (
        <div>
          <p className="mb-3">아래 내용을 복사해 엑셀이나 구글 시트에 붙여넣으세요.</p>
          <textarea id="csvbox" readOnly value={text}
            className="w-full h-[240px] rounded-xl border border-line bg-paper/70 p-3.5 num text-[11.5px] leading-relaxed text-ink resize-y" />
        </div>
      ),
      onOk: () => {
        saveSettings({ lastExport: Date.now() });
        const ta = document.getElementById("csvbox");
        let ok = false;
        try{ if(ta){ ta.focus(); ta.select(); ok = document.execCommand("copy"); } }catch(e){}
        if(!ok && navigator.clipboard){
          navigator.clipboard.writeText(text).then(() => say("복사했습니다"), () => say("복사 실패 — 직접 선택해 복사해 주세요"));
          return;
        }
        say(ok ? "복사했습니다" : "복사 실패 — 직접 선택해 복사해 주세요");
      }
    });
  }

  /* 집계 */
  const rows = STAFF.map(n => { const r = getRec(db, viewKey, n); return { name:n, r, st:stateOf(r) }; });
  const nWork = rows.filter(x => x.st === "work").length;
  const nRest = rows.filter(x => x.st === "rest").length;
  const nDone = rows.filter(x => x.st === "done").length;
  const nIdle = rows.filter(x => x.st === "idle").length;
  const totalMs = rows.reduce((s,x) => s + (x.st === "done" ? netMs(x.r) : 0), 0);
  const totalBrk = rows.reduce((s,x) => s + (x.st === "done" ? breakMs(x.r, x.r.out) : 0), 0);

  const clock = new Date(now);

  /* 백업 알림 */
  const hasData = Object.keys(db).some(k => db[k] && Object.keys(db[k]).length);
  const sinceExport = settings.lastExport ? Math.floor((Date.now() - settings.lastExport)/86400000) : null;
  const needBackup = hasData && (settings.lastExport == null || sinceExport >= 7);

  function goDate(k){ setTab("board"); setViewKey(k); }
  function monthCSV(){
    const text = buildMonthCSV(month);
    if(!text){ say("이 달에 내보낼 기록이 없습니다"); return; }
    openCSVText(prettyMonth(month) + " 정산 CSV", text);
  }

  return (
    <div className="min-h-screen">
      {/* ── 헤더 ── */}
      <header className="border-b border-line">
        <div className="mx-auto max-w-[1160px] px-6 pt-9 pb-7">
          <div className="flex items-end gap-6 flex-wrap">
            <div className="min-w-0">
              <div className="num text-[10px] font-bold tracking-[.28em] text-cobalt">CASAPE · ATTENDANCE</div>
              <h1 className="han text-[40px] sm:text-[52px] leading-[0.95] tracking-tight mt-2.5 text-ink">
                {tab === "month" ? "월간 정산" : (locked ? "지난 기록" : (viewKey !== todayKey() ? "어제의 마무리" : "오늘의 도장"))}
              </h1>
              <p className="mt-2.5 text-[14px] text-ink2">
                {tab === "month" ? (
                  <><span className="num font-semibold">{prettyMonth(month)}</span>
                    <span className="ml-2 text-muted">— 휴게시간을 뺀 실근무 시간입니다</span></>
                ) : (
                  <><span className="num font-semibold">{yearOf(viewKey)}</span> · {prettyDate(viewKey)}
                    {!locked && <span className="ml-2 text-muted">— 이름을 누르면 도장이 찍힙니다</span>}</>
                )}
              </p>
            </div>

            <div className="ml-auto text-right">
              <div className="num text-[10px] font-bold tracking-[.28em] text-muted mb-1">현재 시각</div>
              <div className="num font-bold text-ink leading-none tracking-[-.03em] text-[58px] sm:text-[76px]">
                {pad(clock.getHours())}<span className="text-gold2 mx-[2px]">:</span>{pad(clock.getMinutes())}
                <span className="text-[24px] sm:text-[30px] text-muted font-semibold ml-1.5">{pad(clock.getSeconds())}</span>
              </div>
            </div>
          </div>

          {/* 탭 */}
          <div className="mt-7 inline-flex rounded-full border border-line bg-card p-1">
            {[["board","출퇴근 보드"],["month","월간 정산"]].map(([k,lb]) => (
              <button key={k} onClick={() => setTab(k)}
                className={`rounded-full px-4 py-2 text-[12.5px] font-semibold transition-colors ${tab===k ? "bg-ink text-paper" : "text-ink2 hover:text-cobalt"}`}>{lb}</button>
            ))}
          </div>

          {/* 집계 칩 */}
          <div className={`mt-4 flex-wrap gap-2.5 ${tab==="board" ? "flex" : "hidden"}`}>
            {[["근무중",nWork,"work"],["휴게중",nRest,"rest"],["퇴근",nDone,"done"],["미출근",nIdle,"idle"]].map(([lb,v,k]) => (
              <div key={k} className={`flex items-baseline gap-2.5 rounded-full border px-4 py-2
                ${k==="work" ? "border-gold2/45 bg-goldSoft/55" : k==="rest" ? "border-rest2/45 bg-restSoft/60" : k==="done" ? "border-cobalt2/35 bg-cobaltSoft/60" : "border-line bg-paper2/50"}`}>
                <span className={`num text-[21px] font-bold leading-none ${TONE[k].ink}`}>{v}</span>
                <span className="text-[12px] text-ink2">{lb}</span>
              </div>
            ))}
            {carryOver && (
              <button onClick={() => setViewKey(activeKey)}
                className="flex items-center gap-2.5 rounded-full border border-gold2/50 bg-goldSoft/70 px-4 py-2 hover:border-gold transition-colors">
                <span className="w-[6px] h-[6px] rounded-full bg-gold2 pulse-dot"></span>
                <span className="text-[12px] text-gold font-medium">
                  {prettyDate(activeKey)} 미퇴근 <span className="num font-bold">{carryCount}</span>명
                </span>
              </button>
            )}
            <div className="ml-auto max-sm:ml-0 max-sm:w-full flex items-center gap-1.5 flex-wrap">
              <button onClick={() => shift(-1)}
                className="whitespace-nowrap rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 hover:border-cobalt hover:text-cobalt transition-colors">◀ 이전날</button>
              <input type="date" value={viewKey} max={todayKey()}
                onChange={e => { if(e.target.value) setViewKey(e.target.value); }}
                className="num whitespace-nowrap rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] text-ink" />
              <button onClick={() => shift(1)} disabled={viewKey >= todayKey()}
                className="whitespace-nowrap rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 enabled:hover:border-cobalt enabled:hover:text-cobalt disabled:opacity-35 transition-colors">다음날 ▶</button>
              <button onClick={() => setViewKey(todayKey())}
                className="whitespace-nowrap rounded-full bg-ink px-4 py-2 text-[12.5px] font-semibold text-paper hover:bg-cobalt transition-colors">오늘</button>
            </div>
          </div>
        </div>
      </header>

      {/* ── 마키 ── */}
      <div className={`border-b border-line bg-paper2/40 overflow-hidden ${tab==="board" ? "" : "hidden"}`}>
        <div className="marq flex whitespace-nowrap py-2.5 w-max">
          {[0,1].map(i => (
            <div key={i} className="flex shrink-0">
              {["이름을 누르면 출근","한 번 더 누르면 퇴근","늦으면 메모칸에 사유를","휴게 버튼 1회 시작 · 1회 종료","기록은 이 기기에 자동 저장"].map((t,j) => (
                <span key={j} className="num text-[10.5px] font-semibold tracking-[.22em] text-muted px-7">{t} ·</span>
              ))}
            </div>
          ))}
        </div>
      </div>

      <main className="mx-auto max-w-[1160px] px-6 pb-24">
        {needBackup && (
          <div className="mt-7 flex flex-wrap items-center gap-3 rounded-2xl border border-gold2/45 bg-goldSoft/60 px-5 py-3.5 text-[13px] text-gold">
            <span className="num text-[10px] font-bold tracking-[.2em] shrink-0">BACKUP</span>
            <span>
              {settings.lastExport == null
                ? "아직 한 번도 백업하지 않았습니다. 기록은 이 태블릿에만 저장됩니다 — CSV로 내보내 보관해 주세요."
                : <>마지막 백업이 <b className="num">{sinceExport}</b>일 전입니다. CSV로 내보내 보관해 주세요.</>}
            </span>
            <button onClick={() => openCSV("전체 기록 CSV", Object.keys(db))}
              className="ml-auto rounded-full border border-gold2/60 bg-card px-3.5 py-2 text-[12.5px] font-semibold text-gold hover:border-gold transition-colors">지금 백업</button>
          </div>
        )}

        {tab === "month" ? (
          <MonthView db={db} month={month} setMonth={setMonth}
            settings={settings} saveSettings={saveSettings}
            onGoDate={goDate} onCSV={monthCSV} />
        ) : (
        <>
        {!locked && viewKey !== todayKey() && (
          <div className="mt-7 flex items-center gap-3 rounded-2xl border border-gold2/45 bg-goldSoft/60 px-5 py-3.5 text-[13px] text-gold">
            <span className="num text-[10px] font-bold tracking-[.2em] shrink-0">CARRY OVER</span>
            <span>자정을 넘겼지만 아직 근무 중인 인원이 있어 이 날짜를 열어 두었습니다. 여기서 퇴근 도장을 찍으세요.</span>
          </div>
        )}
        {locked && (
          <div className="mt-7 flex items-center gap-3 rounded-2xl border border-cobalt2/35 bg-cobaltSoft/55 px-5 py-3.5 text-[13px] text-cobalt">
            <span className="num text-[10px] font-bold tracking-[.2em] shrink-0">READ ONLY</span>
            <span>지난 날짜를 보고 있습니다. 도장을 찍으려면 <b>오늘</b>로 돌아가세요 — 퇴근이 빠진 기록은 카드에서 <b>시각을 직접 입력</b>해 보정할 수 있습니다.</span>
          </div>
        )}

        {/* ── 카드 ── */}
        <section className="mt-8 grid gap-5 [grid-template-columns:repeat(auto-fill,minmax(300px,1fr))]">
          {rows.map(({name, r}) => (
            <Card key={name} name={name} rec={r} locked={locked} now={now}
              flash={flash === name}
              onPunch={() => punch(name)}
              onMemo={v => { if(!locked) write(name, { memo:v }); }}
              onUndo={() => undo(name)}
              onFix={() => fixOut(name)}
              onBreak={() => punchBreak(name)} />
          ))}
        </section>

        {/* ── 요약 (관리자 전용) ── */}
        {!admin ? (
        <section className="mt-16">
          <div className="flex items-center gap-4 mb-5">
            <h2 className="han text-[24px] text-ink leading-none">근무 요약</h2>
            <div className="h-px flex-1 bg-line"></div>
          </div>
          <div className="rounded-[20px] border border-line bg-card px-6 py-12 text-center shadow-[0_16px_36px_-30px_rgba(36,28,21,.5)]">
            <div className="num text-[10px] font-bold tracking-[.22em] text-muted">ADMIN ONLY</div>
            <p className="mt-3 text-[13.5px] leading-relaxed text-ink2">
              근무 요약은 관리자만 볼 수 있습니다.<br />비밀번호를 입력해 주세요.
            </p>
            <form onSubmit={e => { e.preventDefault(); unlock(); }}
              className="mt-6 flex flex-wrap items-center justify-center gap-2">
              <input type="password" value={pw} onChange={e => setPw(e.target.value)}
                placeholder="비밀번호" aria-label="관리자 비밀번호"
                className="w-[180px] rounded-xl border border-line bg-paper/60 px-4 py-3 text-[15px] text-ink text-center focus:border-cobalt transition-colors" />
              <button type="submit"
                className="rounded-xl bg-ink px-5 py-3 text-[13.5px] font-semibold text-paper hover:bg-cobalt transition-colors">확인</button>
            </form>
          </div>
        </section>
        ) : (
        <section className="mt-16">
          <div className="flex flex-wrap items-center gap-4 mb-5">
            <h2 className="han text-[24px] text-ink leading-none">근무 요약</h2>
            <div className="h-px flex-1 bg-line"></div>
            <button onClick={() => { setAdmin(false); say("근무 요약을 다시 잠갔습니다"); }}
              className="rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 hover:border-cobalt hover:text-cobalt transition-colors">잠그기</button>
            <button onClick={() => openCSV(prettyDate(viewKey) + " CSV", [viewKey])}
              className="rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 hover:border-cobalt hover:text-cobalt transition-colors">이 날짜 CSV</button>
            <button onClick={() => openCSV("전체 기록 CSV", Object.keys(db))}
              className="rounded-full border border-line bg-card px-3.5 py-2 text-[12.5px] font-medium text-ink2 hover:border-cobalt hover:text-cobalt transition-colors">전체 CSV</button>
          </div>

          <div className="rounded-[20px] border border-line bg-card overflow-x-auto shadow-[0_16px_36px_-30px_rgba(36,28,21,.5)]">
            <table className="w-full min-w-[600px] text-[13.5px]">
              <thead>
                <tr className="bg-paper/70">
                  {["이름","출근","퇴근","휴게","실근무","메모"].map(h => (
                    <th key={h} className="num text-left text-[9.5px] font-bold tracking-[.2em] text-muted px-5 py-3.5 border-b border-line">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map(({name, r, st}) => (
                  <tr key={name} className="border-b border-line2 last:border-0 hover:bg-paper/50 transition-colors">
                    <td className="px-5 py-3.5 whitespace-nowrap">
                      <span className={`inline-block w-[7px] h-[7px] rounded-full mr-2.5 align-middle ${TONE[st].bar} ${st==="idle" ? "opacity-45" : ""}`}></span>
                      <span className="font-semibold text-ink">{name}</span>
                    </td>
                    <td className="num px-5 py-3.5 whitespace-nowrap text-ink2">{r.in ? hhmm(r.in) : "—"}</td>
                    <td className="num px-5 py-3.5 whitespace-nowrap text-ink2">
                      {r.out ? hhmm(r.out) : "—"}
                      {r.fixed && <span className="ml-1.5 rounded-full bg-cobaltSoft px-[6px] py-[1px] text-[10px] font-bold text-cobalt">보정</span>}
                    </td>
                    <td className="px-5 py-3.5 whitespace-nowrap text-rest">
                      {r.in ? (breakMs(r, r.out != null ? r.out : now) ? "-" + durTight(breakMs(r, r.out != null ? r.out : now)) : "—") : "—"}
                    </td>
                    <td className={`px-5 py-3.5 whitespace-nowrap font-semibold ${st==="idle" ? "text-line" : TONE[st].ink}`}>
                      {st==="idle" ? "—" : durPlain(netMs(r, now))}
                      {(st==="work"||st==="rest") && <span className="ml-1.5 text-[11px] font-medium text-muted">진행중</span>}
                    </td>
                    <td className="px-5 py-3.5 text-[12.5px] text-ink2 max-w-[300px]">{r.memo || ""}</td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr className="bg-paper/70 border-t border-line">
                  <td className="px-5 py-4 font-bold text-ink">합계</td>
                  <td className="px-5 py-4"></td>
                  <td className="px-5 py-4"></td>
                  <td className="px-5 py-4 font-semibold text-rest whitespace-nowrap">{totalBrk ? "-" + durTight(totalBrk) : "—"}</td>
                  <td className="px-5 py-4 font-bold text-cobalt whitespace-nowrap">{totalMs ? durPlain(totalMs) : "—"}</td>
                  <td className="px-5 py-4 text-[12px] text-muted whitespace-nowrap">퇴근 완료 기준</td>
                </tr>
              </tfoot>
            </table>
          </div>

          <p className="mt-6 text-[11.5px] leading-relaxed text-muted">
            기록은 이 기기의 브라우저에 자동 저장됩니다. 다른 기기에서는 보이지 않으며, 브라우저 데이터를 지우면 함께 삭제됩니다.<br />
            메모칸 오른쪽 ↺ 는 그 사람의 그날 출퇴근 시각을 처음으로 되돌립니다.
          </p>
        </section>
        )}
        </>
        )}
      </main>

      <Modal data={modal} onClose={() => setModal(null)} />

      <div className={`fixed left-1/2 bottom-7 z-[60] -translate-x-1/2 rounded-full bg-ink px-5 py-3 text-[13px] font-medium text-paper
                       shadow-[0_18px_36px_-16px_rgba(36,28,21,.7)] transition-all duration-200
                       ${toast ? "opacity-100 translate-y-0" : "opacity-0 translate-y-3 pointer-events-none"}`}>
        {toast}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
